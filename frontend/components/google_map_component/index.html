<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      html, body, #map {
        width: 100%;
        height: 100%;
        min-height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        border-radius: 16px;
        font-family: Arial, sans-serif;
      }

      #map {
        background: #eaf2f6;
      }

      #map-status {
        position: absolute;
        inset: 0;
        z-index: 2;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 1.25rem;
        box-sizing: border-box;
        background: #f8fafc;
        color: #334155;
        text-align: center;
        font: 14px/1.5 Arial, sans-serif;
      }

      #map-status[data-visible="true"] {
        display: flex;
      }

      #map-level-status {
        position: absolute;
        top: 10px;
        left: 126px;
        z-index: 1;
        max-width: calc(100% - 150px);
        padding: 6px 9px;
        border-radius: 4px;
        background: rgba(255, 255, 255, .94);
        color: #334155;
        box-shadow: 0 1px 4px rgba(15, 23, 42, .24);
        font: 11px/1.35 Arial, sans-serif;
        pointer-events: none;
      }

      .admin-boundary-label {
        color: #123b3b;
        font-family: Arial, sans-serif;
        font-size: 11px;
        font-weight: 700;
        text-shadow:
          -1px -1px 2px #fff,
          1px -1px 2px #fff,
          -1px 1px 2px #fff,
          1px 1px 2px #fff;
        white-space: nowrap;
      }

      .rsa-toggle {
        margin: 10px 0 0 10px;
        padding: 8px 11px;
        border: 0;
        border-radius: 4px;
        background: #fff;
        color: #0f172a;
        box-shadow: 0 1px 4px rgba(15, 23, 42, .3);
        cursor: pointer;
        font: 500 13px Arial, sans-serif;
      }

      .rsa-toggle[aria-pressed="true"] {
        background: #0284c7;
        color: #fff;
      }

      .map-info {
        min-width: 150px;
        color: #0f172a;
        font: 13px/1.5 Arial, sans-serif;
      }

      .map-info h3 {
        margin: 0 0 5px;
        font-size: 14px;
      }

      .map-info p {
        margin: 2px 0;
      }
    </style>
  </head>
  <body>
    <div id="map" role="application" aria-label="Interactive Google map"></div>
    <div id="map-level-status" aria-live="polite">Rwanda administrative boundaries · NISR 2022</div>
    <div id="map-status" role="status" aria-live="polite"></div>
    <script src="google_map.js"></script>
  </body>
</html>
