name: Render services keep-alive

on:
  push:
    branches:
      - dev
      - deploy/render-20261030
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-services-keep-alive
  cancel-in-progress: false

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BACKEND_URL: ${{ secrets.BACKEND_URL }}
      FRONTEND_URL: https://agrimenya-app-20261030.onrender.com
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
    steps:
      - name: Check health and restart if unavailable
        shell: bash
        run: |
          set -euo pipefail
          : "${BACKEND_URL:?Set the BACKEND_URL GitHub Actions secret}"

          base_url="${BACKEND_URL%/}"
          backend_health_url="${base_url}/health/live"
          backend_readiness_url="${base_url}/health/ready"
          frontend_health_url="${FRONTEND_URL%/}/_stcore/health"

          check_health() {
            local service_name="$1"
            local health_url="$2"
            local max_attempts="$3"
            local attempt
            local status
            for attempt in $(seq 1 "$max_attempts"); do
              status="$(curl --silent --show-error --output /dev/null \
                --write-out '%{http_code}' --max-time 60 "$health_url" || true)"
              if [[ "$status" == "200" ]]; then
                echo "${service_name} health check succeeded on attempt ${attempt}/${max_attempts}."
                return 0
              fi
              echo "${service_name} health attempt ${attempt}/${max_attempts} returned ${status:-no response}."
              if [[ "$attempt" -lt "$max_attempts" ]]; then
                sleep 20
              fi
            done
            return 1
          }

          # Wake both free services together instead of leaving Streamlit asleep.
          check_health "Backend" "$backend_health_url" 6 &
          backend_check_pid=$!
          check_health "Streamlit" "$frontend_health_url" 6 &
          frontend_check_pid=$!

          backend_failed=0
          frontend_failed=0
          if ! wait "$backend_check_pid"; then
            backend_failed=1
          fi
          if ! wait "$frontend_check_pid"; then
            frontend_failed=1
          fi

          if [[ "$backend_failed" -eq 1 ]]; then
            if [[ -n "${RENDER_API_KEY:-}" && -n "${RENDER_SERVICE_ID:-}" ]]; then
              echo "Backend health failed; requesting a Render service restart."
              curl --fail-with-body --silent --show-error --request POST \
                --header "Authorization: Bearer ${RENDER_API_KEY}" \
                "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/restart"
              echo "Restart requested; waiting for the replacement instance."
              sleep 30
              check_health "Backend" "$backend_health_url" 6
            else
              echo "Backend health failed; Render restart secrets are not configured."
              exit 1
            fi
          else
            echo "Backend health check succeeded; no restart was necessary."
          fi

          if [[ "$frontend_failed" -eq 1 ]]; then
            echo "Streamlit remained unhealthy after the concurrent wake-up."
            exit 1
          fi

          if ! check_health "Backend readiness (database and baselines)" "$backend_readiness_url" 3; then
            echo "Backend is live but not ready; check database connectivity and baseline availability."
            exit 1
          fi
