services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agri-menya-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: agri-menya-frontend
    ports:
      - "${FRONTEND_PORT:-8501}:8501"
    environment:
      API_BASE_URL: http://api:8000
      USER_API_KEY: ${USER_API_KEY:-}
    depends_on:
      - api
    restart: unless-stopped

  vision-train:
    build:
      context: .
      dockerfile: Dockerfile.train
    container_name: agri-menya-vision-train
    volumes:
      - ./data:/app/data
      - ./app/ml/artifacts:/app/app/ml/artifacts
    profiles:
      - train
    restart: "no"
