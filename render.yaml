services:
  - type: web
    name: agrimenya-api-20261030
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: frankfurt
    plan: free
    healthCheckPath: /health/live
    envVars:
      - key: APP_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: USER_API_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://agrimenya-app-20261030.onrender.com
      - key: ALLOWED_HOSTS
        value: agrimenya-api-20261030.onrender.com,localhost,127.0.0.1
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ADMIN_PASSWORD_RESET_URL
        value: https://agrimenya-app-20261030.onrender.com/Admin
      - key: COMMUNITY_PASSWORD_RESET_URL
        value: https://agrimenya-app-20261030.onrender.com/Community
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        value: https://agrimenya-app-20261030.onrender.com/community/auth/google/callback
      - key: COMMUNITY_GOOGLE_CALLBACK_URL
        value: https://agrimenya-app-20261030.onrender.com/Community
      - key: WHATSAPP_MODE
        value: mock

  - type: web
    name: agrimenya-app-20261030
    runtime: docker
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: frankfurt
    plan: free
    healthCheckPath: /_stcore/health
    envVars:
      - key: API_BASE_URL
        value: https://agrimenya-api-20261030.onrender.com
      - key: API_HOST
        fromService:
          name: agrimenya-api-20261030
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: USER_API_KEY
        fromService:
          name: agrimenya-api-20261030
          type: web
          envVarKey: USER_API_KEY
      - key: GOOGLE_MAPS_API_KEY
        sync: false
