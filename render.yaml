services:
  - type: web
    name: agrimenya-api-20261030
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: frankfurt
    plan: free
    dockerCommand: "sh -c 'uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}'"
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: USER_API_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ALLOWED_ORIGINS
        value: https://agrimenya-app-20261030.onrender.com
      - key: ALLOWED_HOSTS
        value: agrimenya-api-20261030.onrender.com,localhost,127.0.0.1
      - key: MAX_UPLOAD_SIZE_MB
        value: "10"
      - key: COMMUNITY_PHOTO_BUCKET
        value: community-field-reports
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_VISION_MODEL
        value: qwen/qwen3.8-27b
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: claude-sonnet-4-6
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_USE_SSL
        value: "false"
      - key: SMTP_STARTTLS
        value: "true"
      - key: DEFAULT_NOTIFICATION_EMAIL
        sync: false
      - key: DEFAULT_NOTIFICATION_PHONE
        sync: false
      - key: ADMIN_PASSWORD_RESET_URL
        value: https://agrimenya-app-20261030.onrender.com/Admin
      - key: COMMUNITY_PASSWORD_RESET_URL
        value: https://agrimenya-app-20261030.onrender.com/Community
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        value: https://agrimenya-app-20261030.onrender.com/community/auth/google/callback
      - key: COMMUNITY_GOOGLE_CALLBACK_URL
        value: https://agrimenya-app-20261030.onrender.com/Community
      - key: COMMUNITY_GOOGLE_HANDOFF_COOKIE_DOMAIN
        sync: false
      - key: TWILIO_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_API_KEY_SID
        sync: false
      - key: TWILIO_API_KEY_SECRET
        sync: false
      - key: TWILIO_PHONE
        sync: false
      - key: TWILIO_WHATSAPP_NUMBER
        sync: false
      - key: WHATSAPP_MODE
        value: mock
      - key: WHATSAPP_GRAPH_VERSION
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_PUBLIC_NUMBER
        sync: false
      - key: WHATSAPP_PUBLIC_CHAT_ENABLED
        value: "false"
      - key: WHATSAPP_BUSINESS_ACCOUNT_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_DEFAULT_COUNTRY_CODE
        value: "250"
      - key: WHATSAPP_DAILY_CAP
        value: "200"
      - key: ALLOW_UNSIGNED_WEBHOOKS_IN_MOCK
        value: "false"

  - type: web
    name: agrimenya-app-20261030
    runtime: docker
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: frankfurt
    plan: free
    healthCheckPath: /_stcore/health
    envVars:
      - key: API_BASE_URL
        value: https://agrimenya-api-20261030.onrender.com
      - key: API_HOST
        fromService:
          name: agrimenya-api-20261030
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: USER_API_KEY
        fromService:
          name: agrimenya-api-20261030
          type: web
          envVarKey: USER_API_KEY
      - key: GOOGLE_MAPS_API_KEY
        sync: false
